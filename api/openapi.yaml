info:
    contact: {}
    description: Gophkeeper HTTP API.
    title: Gophkeeper API
    version: "1.0"
openapi: 3.0.3
paths:
    /auth/login:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/protocol.LoginRequest'
                description: Login payload
                required: true
                x-originalParamName: request
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/protocol.LoginResponse'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/protocol.ProtocolError'
                    description: Bad Request
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/protocol.ProtocolError'
                    description: Unprocessable Entity
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/protocol.ProtocolError'
                    description: Internal Server Error
            summary: Logins user into their account.
            tags:
                - auth
    /auth/register:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/protocol.RegisterRequest'
                description: Registration payload
                required: true
                x-originalParamName: request
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/protocol.RegisterResponse'
                    description: Created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/protocol.ProtocolError'
                    description: Bad Request
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/protocol.ProtocolError'
                    description: Conflict
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/protocol.ProtocolError'
                    description: Unprocessable Entity
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/protocol.ProtocolError'
                    description: Internal Server Error
            summary: Registers a new user.
            tags:
                - auth
    /vaults/:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/protocol.ProtocolVault'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/protocol.ProtocolError'
                    description: Unauthorized
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/protocol.ProtocolError'
                    description: Internal Server Error
            security:
                - BearerAuth: []
            summary: List user's vaults.
            tags:
                - vaults
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/protocol.CreateVaultRequest'
                description: Vault creation payload
                required: true
                x-originalParamName: request
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/protocol.CreateVaultResponse'
                    description: Created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/protocol.ProtocolError'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/protocol.ProtocolError'
                    description: Unauthorized
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/protocol.ProtocolError'
                    description: Unprocessable Entity
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/protocol.ProtocolError'
                    description: Internal Server Error
            security:
                - BearerAuth: []
            summary: Creates a new vault.
            tags:
                - vaults
    /vaults/{id}:
        delete:
            parameters:
                - description: Vault ID
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "204":
                    description: No Content
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/protocol.ProtocolError'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/protocol.ProtocolError'
                    description: Unauthorized
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/protocol.ProtocolError'
                    description: Not Found
            security:
                - BearerAuth: []
            summary: Deletes a specific vault.
            tags:
                - vaults
        patch:
            parameters:
                - description: Vault ID
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/protocol.UpdateVaultRequest'
                description: Vault update payload
                required: true
                x-originalParamName: request
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/protocol.UpdateVaultResponse'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
