                    description: Unprocessable Entity
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/protocol.ProtocolError'
                    description: Internal Server Error
            security:
                - BearerAuth: []
            summary: Updates a specific vault.
            tags:
