basePath: /
definitions:
  protocol.CreateVaultItemRequest:
    properties:
      ciphertext:
        description: Ciphertext contains the encrypted item data.
        items:
          type: integer
        type: array
      item_nonce:
        description: ItemNonce is the nonce used to encrypt the item.
        items:
          type: integer
        type: array
      key_salt:
        description: KeySalt is the salt used to derive the item encryption key.
        items:
          type: integer
        type: array
    required:
    - ciphertext
    - item_nonce
    - key_salt
    type: object
  protocol.CreateVaultItemResponse:
    properties:
      ciphertext:
        description: Ciphertext contains the encrypted item data.
        items:
          type: integer
        type: array
      created_at:
        description: CreatedAt is the time the item was created.
        type: string
      id:
        description: ID is vault's item id.
        type: string
      item_nonce:
        description: ItemNonce is the nonce used to encrypt the item.
        items:
          type: integer
        type: array
      key_salt:
        description: KeySalt is the salt used to derive the item encryption key.
        items:
          type: integer
        type: array
      updated_at:
        description: UpdatedAt is the time the item was last updated.
        type: string
      vault_id:
        description: VaultID is parent vault's ID.
        type: string
    type: object
  protocol.CreateVaultRequest:
    properties:
      encrypted_master_key:
        description: |-
          EncryptedMasterKey holds an actual encrypted master key. This value is
          safe to be stored in the database.
        items:
          type: integer
        type: array
      encryption_key_size:
        description: EncryptionKeySize describes the size of the returned byte slice.
        type: integer
      encryption_memory_cost:
        description: EncryptionMemoryCost describes how much memory should be used.
        type: integer
      encryption_nonce:
        description: |-
          EncryptionNonce holds the raw bytes that were used by the encryption
          algorithm to encrypt master key.
        items:
          type: integer
        type: array
      encryption_parallelism:
        description: EncryptionParallelism describes how much threads should be used.
        type: integer
      encryption_salt:
        description: |-
          EncryptionSalt holds the raw bytes that were used for the encryption of
          master key.
        items:
          type: integer
        type: array
      encryption_time_cost:
        description: |-
          EncryptionTimeCost describes amount of passes of the given
          EncryptionMemoryCost.
        type: integer
      name:
        description: Name is vault's name.
        maxLength: 64
        minLength: 1
        type: string
    required:
    - encrypted_master_key
    - encryption_key_size
    - encryption_memory_cost
    - encryption_nonce
    - encryption_parallelism
    - encryption_salt
    - encryption_time_cost
    - name
    type: object
  protocol.CreateVaultResponse:
    properties:
      created_at:
        description: CreatedAt is a timestamp when this vault was created.
        type: string
      id:
        description: ID is vault's id.
        type: string
      name:
        description: Name is vault's name.
        type: string
      updated_at:
        description: UpdatedAt is a timestamp when this vault was last updated.
        type: string
    type: object
  protocol.GetVaultItemResponse:
    properties:
      ciphertext:
        description: Ciphertext contains the encrypted item data.
        items:
          type: integer
        type: array
      created_at:
        description: CreatedAt is the time the item was created.
        type: string
      id:
        description: ID is vault's item id.
        type: string
      item_nonce:
        description: ItemNonce is the nonce used to encrypt the item.
        items:
          type: integer
        type: array
      key_salt:
        description: KeySalt is the salt used to derive the item encryption key.
        items:
          type: integer
        type: array
      updated_at:
        description: UpdatedAt is the time the item was last updated.
        type: string
      vault_id:
        description: VaultID is parent vault's ID.
        type: string
    type: object
  protocol.GetVaultKeyringResponse:
    properties:
      created_at:
        description: CreatedAt is the time the keyring was created.
        type: string
      encrypted_master_key:
        description: |-
          EncryptedMasterKey holds an actual encrypted master key. This value is
          safe to be stored in the database.
        items:
          type: integer
        type: array
      encryption_key_size:
        description: EncryptionKeySize describes the size of the returned byte slice.
        type: integer
      encryption_memory_cost:
        description: EncryptionMemoryCost describes how much memory should be used.
        type: integer
      encryption_nonce:
        description: |-
          EncryptionNonce holds the raw bytes that were used by the encryption
          algorithm to encrypt master key.
        items:
          type: integer
        type: array
      encryption_parallelism:
        description: EncryptionParallelism describes how much threads should be used.
        type: integer
      encryption_salt:
        description: |-
          EncryptionSalt holds the raw bytes that were used for the encryption of
          master key.
        items:
          type: integer
        type: array
      encryption_time_cost:
        description: |-
          EncryptionTimeCost describes amount of passes of the given
          EncryptionMemoryCost.
        type: integer
      updated_at:
        description: UpdatedAt is the time the keyring was last updated.
        type: string
      vault_id:
        description: VaultID is an ID of the vault this keyring unlocks.
        type: string
    type: object
  protocol.LoginRequest:
    properties:
      email:
        description: Email is user's email.
        type: string
      password:
        description: Password is user's password.
        maxLength: 64
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  protocol.LoginResponse:
    properties:
      access_token:
        description: AccessToken is a JWT token that is used to access the API.
        type: string
      expires_at:
        description: ExpiresAt is a timestamp when this session expires.
        type: string
      user:
        allOf:
        - $ref: '#/definitions/protocol.ProtocolUser'
        description: User is the object of a user that owns this session.
    type: object
  protocol.ProtocolError:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/protocol.ProtocolErrorCode'
        description: Code is a constant code for the error.
      details:
        additionalProperties: {}
        description: Details is an optional map with error details.
        type: object
      message:
        description: Message is human-readable error message.
        type: string
    type: object
  protocol.ProtocolErrorCode:
    enum:
    - VALIDATION_ERROR
    - INVALID_REQUEST
    - INVALID_ID
    - DUPLICATE_USER
    - REGISTRATION_FAILED
    - LOGIN_UNSUCCESSFUL
    - LOGIN_FAILED
    - UNAUTHORIZED
    - SESSION_VALIDATION_FAILED
    - VAULT_CREATION_FAILED
    - VAULTS_RETRIEVAL_FAILED
    - VAULT_NOT_FOUND
    - VAULT_DELETION_FAILED
    - VAULT_UPDATE_FAILED
    - VAULT_KEYRING_RETRIEVAL_FAILED
    - VAULT_ITEM_CREATION_FAILED
    - VAULT_ITEM_UPDATE_FAILED
    - VAULT_ITEM_NOT_FOUND
    - VAULT_ITEMS_RETRIEVAL_FAILED
    - VAULT_ITEM_DELETION_FAILED
    type: string
    x-enum-varnames:
    - ProtocolErrorValidationFailed
    - ProtocolErrorInvalidRequest
    - ProtocolErrorInvalidID
    - ProtocolErrorDuplicateUser
    - ProtocolErrorRegistrationFailed
    - ProtocolErrorLoginUnsuccessful
    - ProtocolErrorLoginFailed
    - ProtocolErrorUnauthorized
    - ProtocolErrorSessionValidationFailed
    - ProtocolErrorVaultCreationFailed
    - ProtocolErrorVaultsRetrievalFailed
    - ProtocolErrorVaultNotFound
    - ProtocolErrorVaultDeletionFailed
    - ProtocolErrorVaultUpdateFailed
    - ProtocolErrorVaultKeyringRetrievalFailed
    - ProtocolErrorVaultItemCreationFailed
    - ProtocolErrorVaultItemUpdateFailed
    - ProtocolErrorVaultItemNotFound
    - ProtocolErrorVaultItemsRetrievalFailed
    - ProtocolErrorVaultItemDeletionFailed
  protocol.ProtocolUser:
    properties:
      created_at:
        description: CreatedAt is a timestamp when this user was created.
        type: string
      email:
        description: Email is user's email.
        type: string
      id:
        description: ID is user's ID.
        type: string
      updated_at:
        description: UpdatedAt is a timestamp when this user was last updated.
        type: string
    type: object
  protocol.ProtocolVault:
    properties:
      created_at:
        description: CreatedAt is a timestamp when this vault was created.
        type: string
      id:
        description: ID is vault's id.
        type: string
      name:
        description: Name is vault's name.
        type: string
      updated_at:
        description: UpdatedAt is a timestamp when this vault was last updated.
        type: string
    type: object
  protocol.ProtocolVaultItem:
    properties:
      ciphertext:
        description: Ciphertext contains the encrypted item data.
        items:
          type: integer
        type: array
      created_at:
        description: CreatedAt is the time the item was created.
        type: string
      id:
        description: ID is vault's item id.
        type: string
      item_nonce:
        description: ItemNonce is the nonce used to encrypt the item.
        items:
          type: integer
        type: array
      key_salt:
        description: KeySalt is the salt used to derive the item encryption key.
        items:
          type: integer
        type: array
      updated_at:
        description: UpdatedAt is the time the item was last updated.
        type: string
      vault_id:
        description: VaultID is parent vault's ID.
        type: string
    type: object
  protocol.RegisterRequest:
    properties:
      email:
        description: Email is user's email.
        type: string
      password:
        description: Password is user's password.
        maxLength: 64
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  protocol.RegisterResponse:
    properties:
      access_token:
        description: AccessToken is a JWT token that is used to access the API.
        type: string
      expires_at:
        description: ExpiresAt is a timestamp when this session expires.
        type: string
      user:
        allOf:
        - $ref: '#/definitions/protocol.ProtocolUser'
        description: User is the object of a user that owns this session.
    type: object
  protocol.UpdateVaultItemRequest:
    properties:
      ciphertext:
        description: Ciphertext contains the encrypted item data.
        items:
          type: integer
        type: array
      item_nonce:
        description: ItemNonce is the nonce used to encrypt the item.
        items:
          type: integer
        type: array
      key_salt:
        description: KeySalt is the salt used to derive the item encryption key.
        items:
          type: integer
        type: array
    required:
    - ciphertext
    - item_nonce
    - key_salt
    type: object
  protocol.UpdateVaultItemResponse:
    properties:
      ciphertext:
        description: Ciphertext contains the encrypted item data.
        items:
          type: integer
        type: array
      created_at:
        description: CreatedAt is the time the item was created.
        type: string
      id:
        description: ID is vault's item id.
        type: string
      item_nonce:
        description: ItemNonce is the nonce used to encrypt the item.
        items:
          type: integer
        type: array
      key_salt:
        description: KeySalt is the salt used to derive the item encryption key.
        items:
          type: integer
        type: array
      updated_at:
        description: UpdatedAt is the time the item was last updated.
        type: string
      vault_id:
        description: VaultID is parent vault's ID.
        type: string
    type: object
  protocol.UpdateVaultRequest:
    properties:
      name:
        description: Name is a new vault's name.
        maxLength: 64
        minLength: 1
        type: string
    type: object
  protocol.UpdateVaultResponse:
    properties:
      created_at:
        description: CreatedAt is a timestamp when this vault was created.
        type: string
      id:
        description: ID is vault's id.
        type: string
      name:
        description: Name is vault's name.
        type: string
      updated_at:
        description: UpdatedAt is a timestamp when this vault was last updated.
        type: string
    type: object
info:
  contact: {}
  description: Gophkeeper HTTP API.
  title: Gophkeeper API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/protocol.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/protocol.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
      summary: Logins user into their account.
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/protocol.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/protocol.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
      summary: Registers a new user.
      tags:
      - auth
  /vaults/:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/protocol.ProtocolVault'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
      security:
      - BearerAuth: []
      summary: List user's vaults.
      tags:
      - vaults
    post:
      consumes:
      - application/json
      parameters:
      - description: Vault creation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/protocol.CreateVaultRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/protocol.CreateVaultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
      security:
      - BearerAuth: []
      summary: Creates a new vault.
      tags:
      - vaults
  /vaults/{id}:
    delete:
      parameters:
      - description: Vault ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
      security:
      - BearerAuth: []
      summary: Deletes a specific vault.
      tags:
      - vaults
    patch:
      consumes:
      - application/json
      parameters:
      - description: Vault ID
        in: path
        name: id
        required: true
        type: string
      - description: Vault update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/protocol.UpdateVaultRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/protocol.UpdateVaultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
      security:
      - BearerAuth: []
      summary: Updates a specific vault.
      tags:
      - vaults
  /vaults/{id}/items:
    get:
      parameters:
      - description: Vault ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/protocol.ProtocolVaultItem'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
      security:
      - BearerAuth: []
      summary: Lists vault items.
      tags:
      - vault_items
    post:
      consumes:
      - application/json
      parameters:
      - description: Vault ID
        in: path
        name: id
        required: true
        type: string
      - description: Vault item creation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/protocol.CreateVaultItemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/protocol.CreateVaultItemResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
      security:
      - BearerAuth: []
      summary: Creates a new vault item.
      tags:
      - vault_items
  /vaults/{id}/items/{item_id}:
    delete:
      parameters:
      - description: Vault ID
        in: path
        name: id
        required: true
        type: string
      - description: Vault item ID
        in: path
        name: item_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
      security:
      - BearerAuth: []
      summary: Deletes a vault item.
      tags:
      - vault_items
    get:
      parameters:
      - description: Vault ID
        in: path
        name: id
        required: true
        type: string
      - description: Vault item ID
        in: path
        name: item_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/protocol.GetVaultItemResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
      security:
      - BearerAuth: []
      summary: Retrieves a vault item.
      tags:
      - vault_items
    patch:
      consumes:
      - application/json
      parameters:
      - description: Vault ID
        in: path
        name: id
        required: true
        type: string
      - description: Vault item ID
        in: path
        name: item_id
        required: true
        type: string
      - description: Vault item update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/protocol.UpdateVaultItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/protocol.UpdateVaultItemResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
      security:
      - BearerAuth: []
      summary: Updates a vault item.
      tags:
      - vault_items
  /vaults/{id}/keyring:
    get:
      parameters:
      - description: Vault ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/protocol.GetVaultKeyringResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/protocol.ProtocolError'
      security:
      - BearerAuth: []
      summary: Retrieves vault keyring.
      tags:
      - vaults
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
